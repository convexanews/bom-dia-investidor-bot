name: BDI Studio - Publicar Reel aprovado
run-name: Studio Reel ${{ inputs.queue_id }}

on:
  workflow_dispatch:
    inputs:
      queue_id:
        description: Identificador da fila local
        required: true
        type: string
      video_url:
        description: URL pública do vídeo aprovado
        required: true
        type: string
      caption_b64:
        description: Legenda em Base64
        required: true
        type: string
      origin_b64:
        description: Título, link e fonte originais em Base64
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: studio-reel-${{ inputs.queue_id }}
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar Reel aprovado
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          STUDIO_QUEUE_ID: ${{ inputs.queue_id }}
          STUDIO_VIDEO_URL: ${{ inputs.video_url }}
          STUDIO_CAPTION_B64: ${{ inputs.caption_b64 }}
          STUDIO_ORIGIN_B64: ${{ inputs.origin_b64 }}
        run: node publicar-reel-studio.cjs
      - name: Sincronizar histórico com o bot online
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- noticias-postadas.json relatorio.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Registra Reel publicado pelo Studio"
          for tentativa in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((tentativa * 2))
          done
          exit 1
