name: BDI Studio - Agenda na nuvem

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: studio-agenda-cloud
  cancel-in-progress: false

jobs:
  publicar-agendados:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Processar publicações vencidas
        id: agenda
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
        run: node processar-agenda-studio.cjs
      - name: Salvar agenda e histórico
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- studio-agenda-cloud.json noticias-postadas.json relatorio.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Processa agenda cloud do Studio"
          for tentativa in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((tentativa * 2))
          done
          exit 1
      - name: Informar falha de publicação
        if: steps.agenda.outcome == 'failure'
        run: exit 1
