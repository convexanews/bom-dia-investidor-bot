name: Bom Dia Investidor - Story de Notícias

on:
  schedule:
    # Quatro janelas editoriais por dia (08h, 13h, 18h e 20h BRT), cobrindo after-market.
    - cron: '0 11,16,21,23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bdi-publicacao-instagram
  cancel-in-progress: false

jobs:
  story-noticia:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm ci
      - name: Gerar e publicar Story de notícia
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: node auto-story-noticia.cjs
      - name: Salvar registro
        if: always()
        run: |
          git config user.email "bot@bomdiainvestidor.com.br"
          git config user.name "Bom Dia Investidor Bot"
          git add stories-postadas.json verificacoes.json
          git diff --cached --quiet || git commit -m "Atualiza registro de Story de notícia"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Falha ao salvar estado após 3 tentativas" && exit 1
