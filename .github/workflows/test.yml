name: Validar bot

on:
  pull_request:
  push:
    branches: [main, 'agent/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Executar testes
        run: npm test
      - name: Validar scripts principais
        run: |
          node --check auto-post.cjs
          node --check coletor_noticias.cjs
          node --check auto-alerta-recorde.cjs
          node --check coletar_metricas.cjs
          node --check studio-cloud-agenda.cjs
          node --check processar-agenda-studio.cjs
