name: BDI Studio - Publicar criação aprovada
run-name: Studio ${{ inputs.format }} ${{ inputs.queue_id }}

on:
  workflow_dispatch:
    inputs:
      queue_id:
        description: Identificador da fila local
        required: true
        type: string
      format:
        description: Formato aprovado
        required: true
        type: choice
        options: [feed, story, carousel, reel]
      media_b64:
        description: Lista de URLs das mídias em Base64
        required: true
        type: string
      caption_b64:
        description: Legenda em Base64
        required: false
        type: string
      origin_b64:
        description: Origem editorial em Base64
        required: true
        type: string
      options_b64:
        description: Opções de publicação em Base64
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: studio-${{ inputs.queue_id }}
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar criação aprovada
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          STUDIO_QUEUE_ID: ${{ inputs.queue_id }}
          STUDIO_FORMAT: ${{ inputs.format }}
          STUDIO_MEDIA_B64: ${{ inputs.media_b64 }}
          STUDIO_CAPTION_B64: ${{ inputs.caption_b64 }}
          STUDIO_ORIGIN_B64: ${{ inputs.origin_b64 }}
          STUDIO_OPTIONS_B64: ${{ inputs.options_b64 }}
        run: node publicar-studio.cjs
      - name: Sincronizar histórico com o bot online
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- noticias-postadas.json relatorio.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Registra publicação aprovada no Studio"
          for tentativa in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((tentativa * 2))
          done
          exit 1
