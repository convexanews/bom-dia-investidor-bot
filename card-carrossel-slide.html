<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; font-family: 'Inter', 'Segoe UI', Arial, sans-serif; background: #090b10; }
  .card { width: 1080px; height: 1350px; position: relative; display: flex; flex-direction: column; padding: 76px 88px 64px; background: radial-gradient(circle at 95% 5%, #28313d 0, #090b10 40%); }

  /* filete dourado no topo */
  .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 12px; background: #f0c030; }
  .card.positivo::before { background: #8ecf17; }
  .card.negativo::before { background: #ed2929; }

  .topo { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { height: 66px; width: 66px; border-radius: 50%; object-fit: cover; box-shadow: 0 2px 10px rgba(15,23,42,0.12); }
  .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
  .brand-text .t1 { font-size: 24px; font-weight: 900; color: #fff; letter-spacing: 0.5px; }
  .brand-text .t2 { font-size: 14px; font-weight: 700; color: #f0c030; letter-spacing: 2.5px; text-transform: uppercase; }
  .contador {
    font-size: 24px; font-weight: 800; color: #fff;
    background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.25);
    padding: 12px 26px; border-radius: 999px;
  }

  .meio { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 40px; }
  .kicker {
    display: flex; align-items: center; gap: 18px;
    color: #f0c030; font-size: 26px; font-weight: 800; letter-spacing: 4px; text-transform: uppercase;
  }
  .kicker::before { content: ''; width: 58px; height: 4px; background: #f0c030; border-radius: 2px; flex-shrink: 0; }
  .texto { font-size: 56px; line-height: 1.25; font-weight: 800; color: #f6f4ed; letter-spacing: -0.8px; }
  .destaque { display: inline-block; align-self: flex-start; margin-top: 8px; padding: 12px 20px; color: #090b10; background: #f0c030; font-size: 25px; line-height: 1; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
  .positivo .destaque { background: #8ecf17; }
  .negativo .destaque { background: #ed2929; color: #fff; }

  .rodape { display: flex; align-items: center; justify-content: space-between; font-size: 22px; font-weight: 600; color: #a7adb9; }
  .arraste { color: #f0c030; font-weight: 800; }
</style>
</head>
<body>
<div class="card {{TEMA}}">
  <div class="topo">
    <div class="brand">
      <img src="{{LOGO_B64}}" alt="">
      <div class="brand-text">
        <span class="t1">BOM DIA INVESTIDOR</span>
        <span class="t2">Informação · Estratégia</span>
      </div>
    </div>
    <div class="contador">{{CONTADOR}}</div>
  </div>
  <div class="meio">
    <div class="kicker">{{KICKER}}</div>
    <div class="texto">{{TEXTO}}</div>
    <div class="destaque">{{DESTAQUE}}</div>
  </div>
  <div class="rodape">
    <span>bomdiainvestidor.com.br</span>
    <span class="arraste">{{RODAPE_DIREITA}}</span>
  </div>
</div>
</body>
</html>
