<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#071d18}.art{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(150deg,{{COLOR_A}},{{COLOR_B}} 72%,{{COLOR_A}})}.photo{position:absolute;inset:0;background-image:url("{{IMAGE_URL}}");background-size:cover;background-position:center}.overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.78))}.pill{position:absolute;left:72px;top:72px;max-width:620px;padding:19px 34px;border-radius:40px;background:{{ACCENT}};color:#10130f;font-size:25px;font-weight:900;letter-spacing:.5px;text-transform:uppercase}.counter{position:absolute;right:72px;top:76px;padding:13px 24px;border-radius:28px;background:rgba(0,0,0,.56);color:#fff;font-size:20px;font-weight:800}.credit{position:absolute;left:72px;top:153px;max-width:760px;padding:10px 17px;border-radius:8px;background:rgba(0,0,0,.6);color:#f0f3f5;font-size:17px;font-weight:700}.content{position:absolute;left:72px;right:72px;bottom:155px;color:#fff}.headline{max-width:936px;margin:0 0 28px;font-size:{{TITLE_SIZE}}px;line-height:1.03;font-weight:900;letter-spacing:-2px}.body{max-width:920px;color:#e8eeeb;font-size:31px;line-height:1.38;font-weight:400}.footer{position:absolute;left:72px;right:72px;bottom:55px;border-top:1px solid rgba(255,255,255,.32);padding-top:23px;display:flex;justify-content:space-between;gap:30px;color:#fff;font-size:23px;font-weight:800}.cta{color:{{ACCENT}};text-align:right}.story .content{right:120px;bottom:260px}.story .footer{right:150px;bottom:140px}.story .headline{font-size:{{STORY_TITLE_SIZE}}px}.story .body{font-size:34px;line-height:1.4}
.counter:empty,.credit:empty{display:none}
</style></head><body><main class="art {{FORMAT_CLASS}}"><div class="photo"></div><div class="overlay"></div><div class="pill">{{CATEGORY}}</div><div class="counter">{{COUNTER}}</div><div class="credit">{{IMAGE_CREDIT}}</div><section class="content"><h1 class="headline">{{HEADLINE}}</h1><div class="body">{{BODY}}</div></section><footer class="footer"><span>{{SOURCE}}</span><span class="cta">{{CTA}}</span></footer></main></body></html>
